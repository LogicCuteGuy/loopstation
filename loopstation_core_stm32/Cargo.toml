[package]
name = "loopstation_core_stm32"
version = "0.1.0"
edition = "2021"

[features]
default = []
std = ["serde/std"]
embedded = ["stm32h7xx-hal", "cortex-m", "cortex-m-rt", "embedded-hal", "embedded-hal-nb", "panic-halt", "usb-device", "usbd-audio", "usbd-serial"]

[dependencies]
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.5"
postcard = { version = "1.0", default-features = false, features = ["heapless"] }
itoa = { version = "1.0", default-features = false }
nb = "1.0"

# STM32H7 HAL and embedded dependencies (only for embedded builds)
stm32h7xx-hal = { version = "0.16", features = ["stm32h743v", "rt", "usb_hs", "sdmmc", "ethernet"], optional = true }
cortex-m = { version = "0.7", features = ["critical-section-single-core"], optional = true }
cortex-m-rt = { version = "0.7", optional = true }
embedded-hal = { version = "0.2", optional = true }
embedded-hal-nb = { version = "1.0", optional = true }

# USB audio interface dependencies (only for embedded builds)
usb-device = { version = "0.3", optional = true }
usbd-audio = { version = "0.2", optional = true }
usbd-serial = { version = "0.2", optional = true }

# Audio processing
micromath = "2.0"
libm = "0.2"

# Panic handler for embedded (only when not using std)
panic-halt = { version = "0.2", optional = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dev-dependencies]
# Test dependencies
serde_json = "1.0"

[build-dependencies]
# Build script dependencies for embedded compilation
